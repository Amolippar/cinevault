<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield / Vault Shape -->
  <polygon points="120,20 210,65 210,165 120,215 30,165 30,65" fill="#111726" stroke="url(#vaultGrad)" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Inner Cinema Aperture / Play Glyph -->
  <circle cx="120" cy="115" r="45" stroke="#1f2b45" stroke-width="4" stroke-dasharray="10 6" />
  <polygon points="108,95 142,115 108,135" fill="url(#vaultGrad)" filter="url(#glow)" />

  <!-- Film Perforations -->
  <rect x="45" y="80" width="8" height="12" rx="2" fill="#10b981" opacity="0.6"/>
  <rect x="45" y="105" width="8" height="12" rx="2" fill="#10b981" opacity="0.6"/>
  <rect x="45" y="130" width="8" height="12" rx="2" fill="#10b981" opacity="0.6"/>
  
  <rect x="187" y="80" width="8" height="12" rx="2" fill="#10b981" opacity="0.6"/>
  <rect x="187" y="105" width="8" height="12" rx="2" fill="#10b981" opacity="0.6"/>
  <rect x="187" y="130" width="8" height="12" rx="2" fill="#10b981" opacity="0.6"/>
</svg>
